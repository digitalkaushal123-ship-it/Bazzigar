    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Cinematic background vignette and golden rays */
        .cinematic-bg {
            background: radial-gradient(circle at 50% 25%, rgba(223, 177, 48, 0.12) 0%, rgba(5, 5, 5, 0.95) 70%, #030303 100%);
        }

        /* Luxury gold gradient text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF8DC 0%, #DFB130 50%, #9A7311 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(223, 177, 48, 0.3));
        }

        /* Premium button gradient & cinematic glow */
        .gold-gradient-btn {
            background: linear-gradient(135deg, #FCEAB7 0%, #DFB130 50%, #9A7311 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .gold-gradient-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: transform 0.7s ease-in-out;
        }
        .gold-gradient-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }
        .gold-gradient-btn:hover {
            box-shadow: 0 0 35px rgba(223, 177, 48, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Glowing card border */
        .cinematic-card {
            background: linear-gradient(145deg, rgba(15, 15, 16, 0.9) 0%, rgba(8, 8, 8, 0.95) 100%);
            border: 1px solid rgba(223, 177, 48, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(223, 177, 48, 0.08);
        }
        .cinematic-card:hover {
            border-color: rgba(223, 177, 48, 0.5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(223, 177, 48, 0.15);
        }

        /* Pulsing live dot */
        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .live-dot {
            animation: pulse-glow 2s infinite;
        }

        /* Floating particles */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-15px) rotate(180deg); opacity: 0.8; }
        }
        .particle {
            position: absolute;
            background: #DFB130;
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }
    </style>

<body class="min-h-full flex flex-col items-center justify-center p-4 sm:p-6 relative cinematic-bg">

            <div class="absolute inset-3 rounded-full border border-dashed border-gold/50 animate-spin" style="animation-direction: reverse; animation-duration: 30s;"></div>
            
            <!-- Core badge box -->
            <div class="absolute inset-6 rounded-full bg-gradient-to-b from-neutral-900 via-neutral-950 to-black border border-gold/40 flex flex-col items-center justify-center p-4 shadow-[inset_0_0_20px_rgba(223,177,48,0.2)]">

    </div>

    <!-- Footer Copyright -->
    <footer class="mt-6 text-center text-xs text-neutral-500 z-10 tracking-widest uppercase font-semibold">

    </footer>

    <!-- Interactive Live Countdown Script -->
    <script>
        let totalSeconds = 14 * 60 + 31;
        const timerDisplay = document.getElementById('countdownTimer');

        setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }, 1000);
    </script>
